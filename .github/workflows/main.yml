name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  linter:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --extra test
      - name: Run linter
        run: uv run make lint

  tests_linux:
    needs: linter
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --extra test
      - name: Run tests
        run: uv run pytest -v --cov-config .coveragerc --cov=rl_framework -l --tb=short --maxfail=1 tests/
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5

  tests_mac:
    needs: linter
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --extra test
      - name: Run tests
        run: uv run pytest -v --cov-config .coveragerc --cov=rl_framework -l --tb=short --maxfail=1 tests/

  tests_win:
    needs: linter
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --extra test
      - name: Run tests
        run: uv run pytest -s -vvvv -l --tb=long tests/
